name: Native release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - label: macOS Intel
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - label: Linux x64
            platform: ubuntu-22.04
            rust_targets: ""
            args: --bundles appimage,deb
          - label: Windows x64
            platform: windows-latest
            rust_targets: ""
            args: --bundles nsis,msi

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build and upload native packages
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Gradia v__VERSION__"
          releaseBody: "Native Windows, macOS, and Linux packages. See RELEASE_NOTES.md in the repository for details."
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          args: ${{ matrix.args }}

      - name: Build unbundled Windows standalone executable
        if: matrix.platform == 'windows-latest'
        run: npm run tauri build -- --no-bundle

      - name: Upload Windows standalone executable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $source = "src-tauri/target/release/gradia.exe"
          $asset = Join-Path $env:RUNNER_TEMP "Gradia_${version}_windows_x64_standalone.exe"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Standalone executable was not produced at $source"
          }
          Copy-Item -LiteralPath $source -Destination $asset
          gh release upload "v$version" $asset --repo "${{ github.repository }}" --clobber
