name: Bug report
description: Report reproducible Gradia behavior using fictional or redacted data.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Gradia. Do not attach real student records,
        institutional workbooks, databases, backups, credentials, or private paths.

  - type: input
    id: version
    attributes:
      label: Gradia version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS source build
        - Linux source build
        - Browser preview
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use fictional data and the smallest reliable sequence.
      placeholder: |
        1. Open …
        2. Select …
        3. Enter …
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Logs or screenshots with identities, marks, credentials, and local paths removed.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all real student, institutional, credential, database, backup, and private-path data.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
