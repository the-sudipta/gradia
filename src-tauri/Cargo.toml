[package]
name = "gradia"
version = "0.2.2"
description = "Gradia — Smarter academic assessment."
authors = ["Gradia"]
edition = "2021"

[lib]
name = "gradia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
zip = { version = "4", default-features = false, features = ["deflate", "time"] }
quick-xml = "0.41"
regex = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
